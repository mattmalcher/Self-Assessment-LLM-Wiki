# Source registry for the Self Assessment LLM Wiki.
#
# This is the single source of truth for every tracked source. `fetch.py`
# reads this file, dispatches each entry to the fetcher named by `type`,
# and writes/updates the markdown file at `output`.
#
# status:
#   fetch      - pipeline pulls real content for this source on every run
#   registered - tracked for visibility/future use, not fetched yet.
#                Flip to `fetch` and add an `output` path to bring it in.
#
# type (see pipeline/fetchers/):
#   legislation             - legislation.gov.uk Act/SI, via data.xml
#   govuk_content            - single GOV.UK Content API document (guidance,
#                               a manual section, a helpsheet, etc.)
#   govuk_content_collection - a GOV.UK "document_collection", written out
#                               as an index page of its member documents
#   govuk_content_manual      - a GOV.UK "manual" hub: walks the manual's
#                               section tree breadth-first, fetching every
#                               leaf section's body in full.
#   caselaw_feed              - caselaw.nationalarchives.gov.uk Atom feed,
#                               incremental by cursor, written as an index
#                               of recent decisions
#   web_page                  - generic HTML page, hashed for change
#                               detection (used for non-gov.uk sources)
#
# Every `fetch` entry gets cache-validator + hash state written back into
# pipeline/manifest.json (not here) so re-runs can skip unchanged sources.

