# ---------------------------------------------------------------------------

- id: itepa-2003
  category: legal-system.primary-legislation
  type: legislation
  title: Income Tax (Earnings and Pensions) Act 2003
  url: https://www.legislation.gov.uk/ukpga/2003/1
  status: fetch
  output: corpus/legal-system/primary-legislation/acts/itepa-2003.md
  note: Defines employment income, pensions and social security income charged to Income Tax.

- id: crca-2005
  category: legal-system.primary-legislation
  type: legislation
  title: Commissioners for Revenue and Customs Act 2005
  url: https://www.legislation.gov.uk/ukpga/2005/11
  status: fetch
  output: corpus/legal-system/primary-legislation/acts/crca-2005.md
  note: Establishes HMRC and the Commissioners' powers and duties.

- id: tma-1970
  category: legal-system.primary-legislation
  type: legislation
  title: Taxes Management Act 1970
  url: https://www.legislation.gov.uk/ukpga/1970/9
  status: fetch
  output: corpus/legal-system/primary-legislation/acts/tma-1970.md
  note: >-
    Not in the original brief, added because it is the actual Self Assessment
    administration act: returns, enquiries, assessments, appeals, and
    penalties (s.7-9, s.28A-28C, s.29-36, s.34-43, s.93-98, Sch 1A/1AB).
    Central to any future "head of duty" implementation.

