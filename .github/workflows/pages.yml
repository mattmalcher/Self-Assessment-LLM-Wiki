name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "corpus/**"
      - "extracts/**"
      - "src/self_assessment_wiki/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --locked

      # The site must not claim a source it does not actually mirror: every
      # `status: fetch` entry has to reconcile to a file (and, for shared
      # outputs, to its own section) before anything is published.
      - name: Reconcile fetched sources with corpus artifacts
        run: uv run reconcile

      # The status page and the nav are generated from the corpus, the
      # extracts and the page plan. If what is committed no longer matches
      # them, the site would publish a stale claim about its own coverage -
      # so fail here rather than deploy it.
      - name: Check the status page and nav are in sync
        run: uv run report --check

      - run: uv run mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
