name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "corpus/**"
      - "extracts/**"
      - "src/self_assessment_wiki/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --locked

      # No network and no model calls, so this is the cheapest gate there is
      # and it runs before anything is published.
      - name: Offline regression tests
        run: uv run pytest -q

      # The audit walks everything the site rests on - the registry, the
      # corpus artifacts (as `uv run reconcile` does), the extract cache,
      # both manifests, the status page and nav (as `uv run report --check`
      # does), the structure of every generated page, and the provenance of
      # the citations on them. A broken artifact fails the deploy; content
      # findings are printed as warnings and land in the run report.
      - name: Audit the published artifacts
        run: uv run audit

      - run: uv run mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
