# Stage 1 only: refresh the raw corpus/ mirror.
#
# The LLM stages (extract + compose) deliberately do NOT run here. They are
# meant to run locally against the maintainer's own Claude or OpenAI
# subscription - see synth/README.md - so CI never needs an API key and
# never spends one. What this workflow does instead is tell you, in the PR it
# opens, exactly which wiki pages the corpus change has made stale.
name: Refresh corpus

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-corpus
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --locked

      # Before spending any network calls: the suite is offline and takes
      # under a second, and a refresh built on broken code is wasted work.
      - name: Offline regression tests
        run: uv run pytest -q

      # `fetch` exits non-zero if any source failed, and writes its report
      # either way. Remember that here rather than stopping: the sources that
      # did change should still reach a PR, and the job fails at the end.
      - name: Fetch sources
        id: fetch
        run: |
          if uv run fetch; then
            echo "partial=false" >> "$GITHUB_OUTPUT"
          else
            echo "partial=true" >> "$GITHUB_OUTPUT"
          fi

      # A corpus change moves the chunk counts and can move the nav, so the
      # published status has to travel in the same PR as the corpus that
      # caused it - otherwise the sync check fails on main after the merge.
      - name: Regenerate the status page and nav
        run: uv run report

      - name: Report what this makes stale
        run: |
          {
            cat src/self_assessment_wiki/pipeline/last_run_summary.md
            echo
            echo '### Synthesis work this creates'
            echo
            echo 'Run locally on the merged branch:'
            echo
            echo '```bash'
            echo 'uv run extract   # fills the extract cache for changed chunks'
            echo 'uv run compose   # rewrites only the pages whose inputs moved'
            echo '```'
            echo
            echo '<details><summary>Current plan</summary>'
            echo
            echo '```'
            uv run status || true
            echo '```'
            echo
            echo '</details>'
          } > src/self_assessment_wiki/pipeline/pr_body.md

      # Non-fatal here so a refresh that damaged an artifact still reaches a
      # PR someone can look at; the job is failed at the end instead. The
      # report is uploaded with the fetch report below.
      - name: Audit the refreshed artifacts
        id: audit
        continue-on-error: true
        run: uv run audit

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- corpus src/self_assessment_wiki/pipeline/manifest.json docs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-run-report
          path: |
            src/self_assessment_wiki/pipeline/last_run.json
            src/self_assessment_wiki/last_audit.json
          if-no-files-found: warn

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Refresh corpus"
          title: ${{ steps.fetch.outputs.partial == 'true' && 'Scheduled corpus refresh (PARTIAL - some sources failed)' || 'Scheduled corpus refresh' }}
          body-path: src/self_assessment_wiki/pipeline/pr_body.md
          branch: automated/refresh-corpus
          delete-branch: true
          add-paths: |
            corpus
            docs/meta/sources.md
            docs/meta/wiki-status.md
            docs/.pages
            docs/*/.pages
            src/self_assessment_wiki/pipeline/manifest.json

      # Last, so a partial refresh still opens its PR - but the run is red and
      # the PR title says why.
      - name: Fail on a partial refresh
        if: steps.fetch.outputs.partial == 'true'
        run: |
          echo "::error::partial refresh - see last_run.json and the PR body"
          exit 1

      - name: Fail on a broken artifact
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::the artifact audit found an error - see last_audit.json"
          exit 1
