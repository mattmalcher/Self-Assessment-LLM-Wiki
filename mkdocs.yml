site_name: Self Assessment LLM Wiki
site_description: >-
  An LLM-written, continuously refreshed reference on UK Self Assessment,
  condensed from a mirrored corpus of primary legislation, case law, HMRC
  manuals and policy publications, and customer-facing guidance.
site_url: https://mattmalcher.github.io/Self-Assessment-LLM-Wiki/
repo_url: https://github.com/mattmalcher/Self-Assessment-LLM-Wiki
repo_name: mattmalcher/Self-Assessment-LLM-Wiki
edit_uri: ""
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

# The published site is the LLM-written wiki only. The raw mirror lives in
# corpus/ in the repository (6MB+ of legislation) and is deliberately not
# built into the site - pages cite their upstream source URL instead.
#
# Navigation order comes from the .pages files in docs/, so a page that has
# not been composed yet simply doesn't appear rather than breaking the
# --strict build.
plugins:
  - search
  - awesome-pages


markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - def_list
  - footnotes
  - attr_list
